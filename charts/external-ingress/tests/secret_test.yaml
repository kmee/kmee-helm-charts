suite: basic-auth secret tests
templates:
  - ingress-oauth.yaml
tests:
  - it: should not render secret by default
    set:
      internalip: "10.0.0.1"
    asserts:
      - hasDocuments:
          count: 0

  - it: should render secret when httpAuth enabled
    set:
      internalip: "10.0.0.1"
      httpAuth.enabled: true
      httpAuth.secretName: "my-auth"
      httpAuth.secretOpaque: "dXNlcjokYXByMSR..."
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: type
          value: Opaque

  - it: should use configured secret name
    set:
      internalip: "10.0.0.1"
      httpAuth.enabled: true
      httpAuth.secretName: "custom-auth-secret"
      httpAuth.secretOpaque: "dXNlcjokYXByMSR..."
    asserts:
      - equal:
          path: metadata.name
          value: custom-auth-secret

  - it: should store opaque data in auth key
    set:
      internalip: "10.0.0.1"
      httpAuth.enabled: true
      httpAuth.secretName: "my-auth"
      httpAuth.secretOpaque: "dXNlcjokYXByMSR..."
    asserts:
      - equal:
          path: data.auth
          value: "dXNlcjokYXByMSR..."
