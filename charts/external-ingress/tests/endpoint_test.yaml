suite: endpoint tests
templates:
  - endpoint.yaml
tests:
  - it: should render endpoint with configured IP
    set:
      internalip: "10.0.0.1"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: subsets[0].addresses[0].ip
          value: "10.0.0.1"

  - it: should use default port 80
    set:
      internalip: "10.0.0.1"
    asserts:
      - equal:
          path: subsets[0].ports[0].port
          value: 80

  - it: should use configured port
    set:
      internalip: "10.0.0.1"
      internalport: 9000
    asserts:
      - equal:
          path: subsets[0].ports[0].port
          value: 9000

  - it: should have release-scoped name
    set:
      internalip: "10.0.0.1"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-external-ingress-service
