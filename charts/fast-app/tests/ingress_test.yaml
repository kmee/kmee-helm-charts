suite: ingress tests
templates:
  - ingress.yaml
tests:
  - it: should not render ingress by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ingress when enabled
    set:
      ingress.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: should not render ingress when type is gateway-api
    set:
      ingress.enabled: true
      ingress.type: "gateway-api"
    asserts:
      - hasDocuments:
          count: 0

  - it: should use nginx as default ingressClassName
    set:
      ingress.enabled: true
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: should use custom ingressClassName when set
    set:
      ingress.enabled: true
      ingress.className: traefik
    asserts:
      - equal:
          path: spec.ingressClassName
          value: traefik

  # Guarda de regressão: service.extraPorts NUNCA deve virar rota. Uma porta
  # interna alcançável pelo ingress cairia no catch-all da app e responderia
  # HTML com 200 em vez da API interna.
  - it: should never route service.extraPorts
    set:
      ingress.enabled: true
      service.extraPorts:
        - name: internal
          port: 8082
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 1
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8800
