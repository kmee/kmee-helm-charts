suite: gateway resource tests
templates:
  - gateway.yaml
tests:
  - it: should not render Gateway by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render Gateway when createGateway is false
    set:
      ingress.enabled: true
      ingress.type: "gateway-api"
      ingress.gatewayApi.createGateway: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render Gateway when createGateway is true
    set:
      ingress.enabled: true
      ingress.type: "gateway-api"
      ingress.gatewayApi.createGateway: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Gateway
      - equal:
          path: metadata.name
          value: nginx-gateway
      - equal:
          path: metadata.namespace
          value: nginx-gateway
      - equal:
          path: spec.gatewayClassName
          value: nginx
      - equal:
          path: spec.listeners[0].name
          value: http
      - equal:
          path: spec.listeners[0].port
          value: 80
      - lengthEqual:
          path: spec.listeners
          count: 1

  - it: should render HTTPS listener when tls is set
    set:
      ingress.enabled: true
      ingress.type: "gateway-api"
      ingress.gatewayApi.createGateway: true
      ingress.tls:
        - secretName: barcode-tls
          hosts:
            - barcode.local
    asserts:
      - lengthEqual:
          path: spec.listeners
          count: 2
      - equal:
          path: spec.listeners[1].protocol
          value: HTTPS
      - equal:
          path: spec.listeners[1].port
          value: 443
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: barcode-tls
      - notExists:
          path: spec.listeners[1].tls.certificateRefs[0].namespace

  - it: should set certificate namespace when overridden
    set:
      ingress.enabled: true
      ingress.type: "gateway-api"
      ingress.gatewayApi.createGateway: true
      ingress.gatewayApi.certificateNamespace: certs-ns
      ingress.tls:
        - secretName: barcode-tls
    asserts:
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].namespace
          value: certs-ns

  - it: should render gateway annotations
    set:
      ingress.enabled: true
      ingress.type: "gateway-api"
      ingress.gatewayApi.createGateway: true
      ingress.gatewayApi.gatewayAnnotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod

  - it: should honor custom gatewayClassName and listener settings
    set:
      ingress.enabled: true
      ingress.type: "gateway-api"
      ingress.gatewayApi.createGateway: true
      ingress.gatewayApi.gatewayClassName: nginx-custom
      ingress.gatewayApi.listenerName: web
      ingress.gatewayApi.listenerPort: 8080
    asserts:
      - equal:
          path: spec.gatewayClassName
          value: nginx-custom
      - equal:
          path: spec.listeners[0].name
          value: web
      - equal:
          path: spec.listeners[0].port
          value: 8080
