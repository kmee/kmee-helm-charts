image:
  repository: tiangolo/uvicorn-gunicorn-fastapi
  tag: python3.11-slim
  pullPolicy: IfNotPresent

containerPort: 80

service:
  port: 80
  targetPort: 80
  # Exercita o caminho multi-porta contra o API server real do kind, que é quem
  # valida de fato nome/número de porta duplicado e o limite de 15 caracteres.
  extraPorts:
    - name: internal
      port: 8082

healthCheck:
  enabled: false

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
