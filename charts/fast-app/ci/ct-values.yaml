image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

containerPort: 80

service:
  port: 80
  targetPort: 80

healthCheck:
  enabled: false

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
