# ==============================================================================
# fastapi-app — valores padrão
#
# Para cada aplicação FastAPI, copie este arquivo (ex.: values-gateway.yaml)
# e sobrescreva apenas o que mudar. Tudo aqui tem um default seguro.
# ==============================================================================

# Número de réplicas (ignorado se autoscaling.enabled = true)
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: kmee/brcode
  tag: "latest"          # equivale ao image:latest do compose
  pullPolicy: IfNotPresent

imagePullSecrets: []      # ex.: [{ name: registry-cred }]

# Nome da app dentro do container / porta que o FastAPI escuta (uvicorn)
containerPort: 5057

service:
  type: ClusterIP
  # Porta exposta pelo Service. No compose era 8800 -> mapeie aqui se quiser.
  port: 8800
  # Porta do container para onde o tráfego é encaminhado.
  targetPort: 5057
  # Portas adicionais expostas no mesmo Service e no mesmo container.
  # Use quando o processo escuta em mais de uma porta (ex.: uma API interna
  # service-to-service separada da pública).
  #
  # Estas portas NÃO são roteadas pelo ingress/httproute — eles sempre apontam
  # para `service.port`. Com `service.type: ClusterIP` (default), portanto, só
  # são alcançáveis pelo DNS interno do cluster:
  #   http://<service>.<namespace>.svc.cluster.local:<port>
  #
  # ATENÇÃO: com `service.type: NodePort` ou `LoadBalancer` estas portas também
  # são publicadas externamente, como qualquer porta do Service. Se a porta deve
  # ficar restrita ao cluster, use ClusterIP (e/ou uma NetworkPolicy).
  #
  # Cada item aceita:
  #   name       (obrigatório) nome da porta; máx. 15 caracteres, [a-z0-9-]
  #   port       (obrigatório) porta exposta pelo Service
  #   targetPort (opcional)    porta do container, NUMÉRICA (vira containerPort,
  #                            que não aceita porta nomeada); default = port
  #   protocol   (opcional)    default = TCP
  extraPorts: []
    # - name: internal
    #   port: 8082

# ------------------------------------------------------------------------------
# Variáveis de ambiente (substitui o env_file: .env do compose)
# ------------------------------------------------------------------------------
# Valores NÃO sensíveis -> viram um ConfigMap
env: {}
  # LOG_LEVEL: info
  # WORKERS: "4"

# Valores sensíveis -> viram um Secret (use --set-string ou um values privado)
secretEnv: {}
  # API_TOKEN: "xxxx"
  # DATABASE_URL: "postgres://..."

# Referenciar Secrets/ConfigMaps já existentes no cluster (não criados pelo chart)
envFrom: []
  # - secretRef:
  #     name: gateway-existing-secret
  # - configMapRef:
  #     name: gateway-existing-config

# ------------------------------------------------------------------------------
# Health checks (substitui o healthcheck do compose -> GET /health)
# ------------------------------------------------------------------------------
healthCheck:
  enabled: true
  path: /health
  liveness:
    initialDelaySeconds: 10   # = start_period
    periodSeconds: 30         # = interval
    timeoutSeconds: 5         # = timeout
    failureThreshold: 3       # = retries
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# ------------------------------------------------------------------------------
# Recursos / escalonamento
# ------------------------------------------------------------------------------
resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 500m
  #   memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# ------------------------------------------------------------------------------
# Ingress (opcional)
# ------------------------------------------------------------------------------
ingress:
  enabled: false
  # "ingress" = Ingress tradicional | "gateway-api" = Gateway API (nginx-gateway-fabric)
  type: "ingress"
  className: nginx
  annotations:
    # Tamanho máximo do corpo da requisição (0 = sem limite)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Timeouts (útil para chamadas mais longas da API)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # TLS automático com cert-manager (descomente se usar)
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # Redireciona HTTP -> HTTPS (ative quando tiver TLS)
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: barcode.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: barcode-tls
    #   hosts:
    #     - gateway.local

  # Gateway API (nginx-gateway-fabric) — usado somente quando type = "gateway-api"
  gatewayApi:
    # Cria o recurso Gateway (deixe false se já existir um no cluster)
    createGateway: false
    # GatewayClass usada quando createGateway = true
    gatewayClassName: nginx
    # Nome do listener referenciado pelo HTTPRoute (sectionName)
    listenerName: "http"
    # Para anexar a mais de um listener (ex.: http + https), liste aqui.
    # Se preenchido, tem prioridade sobre listenerName.
    listenerNames: []
    # Timeouts da rota (substitui proxy-read-timeout / proxy-send-timeout)
    timeouts: {}
    #  request: "30s"
    #  backendRequest: "30s"
    # Porta do listener (tipicamente 80)
    listenerPort: 80
    # Namespace onde o Gateway está publicado
    gatewayNamespace: "nginx-gateway"
    # Nome do Gateway
    gatewayName: "nginx-gateway"
    # Anotações extras no HTTPRoute
    annotations: {}
    # Anotações no Gateway criado pelo chart (ex.: cert-manager.io/cluster-issuer)
    gatewayAnnotations: {}
    # Namespace dos Secrets TLS referenciados pelo listener https.
    # Vazio = mesmo namespace do Gateway (recomendado; não exige ReferenceGrant).
    certificateNamespace: ""
    # Filters aplicados em cada rule do HTTPRoute
    # (ex.: SnippetsFilter do nginx-gateway-fabric, RequestHeaderModifier)
    extraFilters: []
    #  - type: ExtensionRef
    #    extensionRef:
    #      group: gateway.nginx.org
    #      kind: SnippetsFilter
    #      name: allowlist

# ------------------------------------------------------------------------------
# Diversos
# ------------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# Segurança (boas práticas; ajuste se a imagem exigir root)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Extras opcionais
extraVolumes: []
extraVolumeMounts: []
