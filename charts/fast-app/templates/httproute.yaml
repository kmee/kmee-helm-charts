{{- if and .Values.ingress.enabled (eq (default "ingress" .Values.ingress.type) "gateway-api") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fastapi-app.fullname" . }}
  labels:
    {{- include "fastapi-app.labels" . | nindent 4 }}
  annotations:
    checksum/httproute: "{{ .Values.ingress | toYaml | sha256sum }}"
    {{- with .Values.ingress.gatewayApi.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gatewayApi.gatewayName }}
      namespace: {{ .Values.ingress.gatewayApi.gatewayNamespace }}
      sectionName: {{ .Values.ingress.gatewayApi.listenerName }}
  hostnames:
    {{- range .Values.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  rules:
    {{- /* Um HTTPRoute cobre todos os hostnames, então as rotas são deduplicadas por path */}}
    {{- $paths := dict }}
    {{- range .Values.ingress.hosts }}
    {{- range .paths }}
    {{- $_ := set $paths .path (default "Prefix" .pathType) }}
    {{- end }}
    {{- end }}
    {{- range $path, $pathType := $paths }}
    - matches:
        - path:
            type: {{ if eq $pathType "Exact" }}Exact{{ else }}PathPrefix{{ end }}
            value: {{ $path | quote }}
      backendRefs:
        - name: {{ include "fastapi-app.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
